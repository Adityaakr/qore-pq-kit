name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
      - run: npm ci
      - run: npm run setup
      # The files that came from peal-tender/kit keep their own formatting.
      - run: forge fmt --check src/threshold src/PqAuthSet.sol test/threshold test/PqAuthSet.t.sol test/PqAuthSetVectors.t.sol test/live/ThresholdProbe.sol test/live/StaticcallGasProbe.sol
      - run: forge test
      - run: npm run typecheck
      - run: npm run test:ts
