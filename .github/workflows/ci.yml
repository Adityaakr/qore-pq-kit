name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
      - run: npm ci
      - run: npm run setup
      - run: forge fmt --check src test
      - run: forge test
      - run: npm run typecheck
      - run: npm run test:ts
